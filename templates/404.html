
{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada | Kotoduo</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <main class="access-denied-container">
        <section class="access-denied-card">
            <div class="access-denied-icon">🔎</div>

            <h1>Página no encontrada</h1>

            <p>
                Lo sentimos, la página que estás buscando no existe
                o la dirección ingresada es incorrecta.
            </p>

            <span class="access-denied-role">
                Error 404 · Recurso no encontrado
            </span>

            <a href="{% url 'usuarios:dashboard' %}" class="access-denied-button">
                Volver al panel principal
            </a>
        </section>
    </main>
</body>
</html>
